<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousike — MCP Client-Server Communication</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 6px; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 30px; }
  svg { max-width: 950px; width: 100%; }

  @keyframes dash { to { stroke-dashoffset: -16; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes sseStream { 0% { opacity: 0; transform: translateX(-10px); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(10px); } }

  .flow { stroke-dasharray: 6 4; animation: dash 0.8s linear infinite; }
  .flow-reverse { stroke-dasharray: 6 4; animation: dash 0.8s linear infinite reverse; }
  .step { animation: fadeIn 0.4s ease-out both; }
  .blink { animation: blink 1.5s ease-in-out infinite; }
  .sse-dot { animation: sseStream 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<h1>MCP Client-Server Communication</h1>
<p class="subtitle">Model Context Protocol — SSE transport between mousike-app and document-service</p>

<svg viewBox="0 0 950 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#58a6ff"/></marker>
    <marker id="aP" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#a371f7"/></marker>
    <marker id="aG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#3fb950"/></marker>
    <marker id="aO" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#d29922"/></marker>
  </defs>

  <!-- MCP Client (mousike-app) -->
  <rect x="30" y="30" width="400" height="280" rx="14" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="230" y="58" text-anchor="middle" fill="#1f6feb" font-size="16" font-weight="700">mousike-app (MCP Client)</text>

  <!-- User request -->
  <g class="step">
    <rect x="55" y="75" width="350" height="40" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="230" y="93" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">POST /api/rag/query?mode=agentic</text>
    <text x="230" y="107" text-anchor="middle" fill="#8b949e" font-size="9">{"question": "What instruments did Bach compose for?"}</text>
  </g>

  <!-- agenticChatClient -->
  <g class="step" style="animation-delay:0.2s">
    <rect x="55" y="125" width="200" height="55" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
    <text x="155" y="148" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">agenticChatClient</text>
    <text x="155" y="165" text-anchor="middle" fill="#8b949e" font-size="9">ChatClient.builder(chatModel)</text>
    <text x="155" y="176" text-anchor="middle" fill="#8b949e" font-size="8">.defaultToolCallbacks(mcpProvider)</text>
  </g>

  <!-- SyncMcpToolCallbackProvider -->
  <g class="step" style="animation-delay:0.3s">
    <rect x="270" y="125" width="145" height="55" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
    <text x="342" y="148" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">SyncMcpTool</text>
    <text x="342" y="162" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">CallbackProvider</text>
    <text x="342" y="176" text-anchor="middle" fill="#8b949e" font-size="8">Spring AI auto-config</text>
  </g>

  <!-- LLM decides to call tool -->
  <g class="step" style="animation-delay:0.4s">
    <rect x="55" y="195" width="350" height="45" rx="6" fill="#a371f7" opacity="0.1" stroke="#a371f7" stroke-width="1"/>
    <text x="230" y="215" text-anchor="middle" fill="#a371f7" font-size="11" font-weight="600">LLM decides: call tool "searchMusicKnowledge"</text>
    <text x="230" y="230" text-anchor="middle" fill="#8b949e" font-size="9">query="Bach instruments", topK=5, minScore=0.65</text>
  </g>

  <!-- SSE config -->
  <g class="step" style="animation-delay:0.35s">
    <rect x="55" y="255" width="350" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="230" y="273" text-anchor="middle" fill="#8b949e" font-size="10">spring.ai.mcp.client.sse.connections.document-service</text>
    <text x="230" y="287" text-anchor="middle" fill="#d29922" font-size="9">url: http://document-service:8090/mcp/sse</text>
  </g>

  <!-- MCP Server (document-service) -->
  <rect x="520" y="30" width="400" height="280" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="720" y="58" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">document-service (MCP Server)</text>

  <!-- McpServerConfig -->
  <g class="step" style="animation-delay:0.25s">
    <rect x="545" y="75" width="350" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="720" y="93" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">McpServerConfig</text>
    <text x="720" y="107" text-anchor="middle" fill="#8b949e" font-size="9">MethodToolCallbackProvider.builder().toolObjects(tools)</text>
  </g>

  <!-- Tools -->
  <g class="step" style="animation-delay:0.4s">
    <rect x="545" y="125" width="160" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="625" y="148" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">searchMusicKnowledge</text>
    <text x="625" y="164" text-anchor="middle" fill="#8b949e" font-size="8">query, topK, minScore</text>
  </g>

  <g class="step" style="animation-delay:0.45s">
    <rect x="720" y="125" width="130" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="785" y="148" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">searchByCategory</text>
    <text x="785" y="164" text-anchor="middle" fill="#8b949e" font-size="8">query, category</text>
  </g>

  <g class="step" style="animation-delay:0.5s">
    <rect x="545" y="185" width="160" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="625" y="205" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">listAvailableDocuments</text>
    <text x="625" y="218" text-anchor="middle" fill="#8b949e" font-size="8">no params</text>
  </g>

  <!-- VectorStore access -->
  <g class="step" style="animation-delay:0.55s">
    <rect x="545" y="240" width="350" height="55" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
    <text x="720" y="262" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">VectorStore.similaritySearch()</text>
    <text x="720" y="278" text-anchor="middle" fill="#8b949e" font-size="9">PGVector · FilterExpressionBuilder for category</text>
    <text x="720" y="290" text-anchor="middle" fill="#8b949e" font-size="8">Returns: formatted source + score + text</text>
  </g>

  <!-- SSE Connection arrows -->
  <!-- Request -->
  <g>
    <path d="M 430 230 L 520 230" stroke="#a371f7" stroke-width="2" marker-end="url(#aP)" class="flow"/>
    <rect x="440" y="215" width="70" height="16" rx="3" fill="#0d1117"/>
    <text x="475" y="227" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="600">SSE</text>
    <circle cx="470" cy="230" r="3" fill="#a371f7" class="sse-dot"/>
    <circle cx="490" cy="230" r="3" fill="#a371f7" class="sse-dot" style="animation-delay:0.3s"/>
    <circle cx="510" cy="230" r="3" fill="#a371f7" class="sse-dot" style="animation-delay:0.6s"/>
  </g>

  <!-- Response -->
  <g>
    <path d="M 520 250 L 430 250" stroke="#3fb950" stroke-width="2" marker-end="url(#aG)" class="flow-reverse"/>
    <circle cx="490" cy="250" r="3" fill="#3fb950" class="sse-dot" style="animation-delay:0.2s"/>
    <circle cx="470" cy="250" r="3" fill="#3fb950" class="sse-dot" style="animation-delay:0.5s"/>
    <circle cx="450" cy="250" r="3" fill="#3fb950" class="sse-dot" style="animation-delay:0.8s"/>
  </g>

  <!-- ═══ Sequence diagram below ═══ -->
  <rect x="30" y="340" width="890" height="320" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="475" y="365" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">MCP Tool Call Sequence</text>

  <!-- Actors -->
  <text x="120" y="395" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">User</text>
  <text x="280" y="395" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">agenticChatClient</text>
  <text x="475" y="395" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">Ollama llama3.2</text>
  <text x="660" y="395" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">MCP Server</text>
  <text x="830" y="395" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">PGVector</text>

  <line x1="120" y1="402" x2="120" y2="645" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="280" y1="402" x2="280" y2="645" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="475" y1="402" x2="475" y2="645" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="660" y1="402" x2="660" y2="645" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="830" y1="402" x2="830" y2="645" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Step 1 -->
  <g class="step" style="animation-delay:0.1s">
    <line x1="120" y1="420" x2="270" y2="420" stroke="#58a6ff" stroke-width="1" marker-end="url(#aB)"/>
    <text x="195" y="415" text-anchor="middle" fill="#58a6ff" font-size="8">"What instruments did Bach compose for?"</text>
  </g>

  <!-- Step 2: prompt → LLM -->
  <g class="step" style="animation-delay:0.3s">
    <line x1="280" y1="445" x2="465" y2="445" stroke="#a371f7" stroke-width="1" marker-end="url(#aP)"/>
    <text x="370" y="440" text-anchor="middle" fill="#a371f7" font-size="8">prompt() with system + user + available tools</text>
  </g>

  <!-- Step 3: LLM returns tool_call -->
  <g class="step" style="animation-delay:0.5s">
    <line x1="465" y1="470" x2="290" y2="470" stroke="#d29922" stroke-width="1" marker-end="url(#aO)"/>
    <text x="370" y="465" text-anchor="middle" fill="#d29922" font-size="8">tool_call: searchMusicKnowledge("Bach instruments", 5, 0.65)</text>
  </g>

  <!-- Step 4: MCP call via SSE -->
  <g class="step" style="animation-delay:0.7s">
    <line x1="280" y1="495" x2="650" y2="495" stroke="#a371f7" stroke-width="1.5" marker-end="url(#aP)" class="flow"/>
    <text x="465" y="490" text-anchor="middle" fill="#a371f7" font-size="8" font-weight="600">MCP SSE: invoke searchMusicKnowledge</text>
  </g>

  <!-- Step 5: Vector search -->
  <g class="step" style="animation-delay:0.9s">
    <line x1="660" y1="520" x2="820" y2="520" stroke="#d29922" stroke-width="1" marker-end="url(#aO)"/>
    <text x="740" y="515" text-anchor="middle" fill="#d29922" font-size="8">similaritySearch(query, topK=5, threshold=0.65)</text>
    <line x1="820" y1="540" x2="670" y2="540" stroke="#3fb950" stroke-width="1" marker-end="url(#aG)"/>
    <text x="745" y="535" text-anchor="middle" fill="#3fb950" font-size="8">[Source: composers.pdf] Bach composed for...</text>
  </g>

  <!-- Step 6: Tool result back -->
  <g class="step" style="animation-delay:1.1s">
    <line x1="650" y1="565" x2="290" y2="565" stroke="#3fb950" stroke-width="1.5" marker-end="url(#aG)" class="flow-reverse"/>
    <text x="465" y="560" text-anchor="middle" fill="#3fb950" font-size="8" font-weight="600">MCP SSE: tool result (formatted text)</text>
  </g>

  <!-- Step 7: Send results to LLM for synthesis -->
  <g class="step" style="animation-delay:1.3s">
    <line x1="280" y1="590" x2="465" y2="590" stroke="#a371f7" stroke-width="1" marker-end="url(#aP)"/>
    <text x="370" y="585" text-anchor="middle" fill="#a371f7" font-size="8">tool_result + "synthesize answer"</text>
  </g>

  <!-- Step 8: Final answer -->
  <g class="step" style="animation-delay:1.5s">
    <line x1="465" y1="615" x2="290" y2="615" stroke="#3fb950" stroke-width="1" marker-end="url(#aG)"/>
    <text x="370" y="610" text-anchor="middle" fill="#3fb950" font-size="8">"Bach composed for organ, harpsichord, violin..."</text>
  </g>

  <!-- Step 9: Return to user -->
  <g class="step" style="animation-delay:1.7s">
    <line x1="280" y1="638" x2="130" y2="638" stroke="#3fb950" stroke-width="1" marker-end="url(#aG)"/>
    <text x="205" y="633" text-anchor="middle" fill="#3fb950" font-size="8">HTTP 200 {"answer": "..."}</text>
  </g>
</svg>
</body>
</html>
