<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousike — Observability & Tracing Data Flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 6px; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 30px; }
  svg { max-width: 1000px; width: 100%; }

  @keyframes dash { to { stroke-dashoffset: -16; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes traceBar { from { width: 0; } to { width: 100%; } }
  @keyframes spanGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .flow { stroke-dasharray: 6 4; animation: dash 0.8s linear infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .span-bar { animation: spanGrow 1.5s ease-out both; transform-origin: left; }
  .span-bar:nth-child(2) { animation-delay: 0.2s; }
  .span-bar:nth-child(3) { animation-delay: 0.4s; }
  .span-bar:nth-child(4) { animation-delay: 0.6s; }
</style>
</head>
<body>
<h1>Observability & Tracing Data Flow</h1>
<p class="subtitle">Dual OTLP export: Phoenix (LLM traces) + Grafana LGTM (metrics, logs, traces)</p>

<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#58a6ff"/></marker>
    <marker id="aG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#3fb950"/></marker>
    <marker id="aO" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#d29922"/></marker>
    <marker id="aP" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#a371f7"/></marker>
  </defs>

  <!-- Application: mousike-app -->
  <rect x="300" y="20" width="400" height="170" rx="12" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="500" y="45" text-anchor="middle" fill="#1f6feb" font-size="15" font-weight="700">mousike-app</text>

  <!-- Inside app: observation layers -->
  <rect x="320" y="58" width="160" height="40" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="400" y="75" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">Spring AI Observations</text>
  <text x="400" y="88" text-anchor="middle" fill="#8b949e" font-size="8">chat · embedding · vectorstore</text>

  <rect x="500" y="58" width="180" height="40" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="590" y="75" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">Micrometer Tracing</text>
  <text x="590" y="88" text-anchor="middle" fill="#8b949e" font-size="8">bridge-otel → SdkTracerProvider</text>

  <rect x="320" y="108" width="120" height="35" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="380" y="125" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">Prometheus</text>
  <text x="380" y="137" text-anchor="middle" fill="#8b949e" font-size="8">micrometer-registry</text>

  <rect x="460" y="108" width="120" height="35" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="520" y="125" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">LogbackOTel</text>
  <text x="520" y="137" text-anchor="middle" fill="#8b949e" font-size="8">traceId in logs</text>

  <rect x="600" y="108" width="80" height="35" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="1"/>
  <text x="640" y="129" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="600">Dual Export</text>

  <!-- ObservabilityConfig.java -->
  <rect x="320" y="150" width="360" height="30" rx="4" fill="#1f6feb" opacity="0.1" stroke="#1f6feb" stroke-width="0.5"/>
  <text x="500" y="169" text-anchor="middle" fill="#58a6ff" font-size="10">ObservabilityConfig: phoenixSpanExporter + grafanaSpanExporter</text>

  <!-- Phoenix target -->
  <rect x="50" y="320" width="280" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="190" y="348" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Phoenix (Arize)</text>
  <text x="190" y="365" text-anchor="middle" fill="#8b949e" font-size="10">LLM Trace Visualization</text>

  <rect x="70" y="380" width="120" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="130" y="394" text-anchor="middle" fill="#8b949e" font-size="9">Traces</text>
  <rect x="200" y="380" width="120" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="260" y="394" text-anchor="middle" fill="#8b949e" font-size="9">Span Details</text>
  <text x="190" y="425" text-anchor="middle" fill="#8b949e" font-size="9">prompt/completion content · latencies · token counts</text>

  <!-- Grafana target -->
  <rect x="620" y="320" width="330" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="785" y="348" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">Grafana LGTM</text>
  <text x="785" y="365" text-anchor="middle" fill="#8b949e" font-size="10">Full Observability Stack</text>

  <rect x="640" y="380" width="65" height="20" rx="3" fill="#0d1117" stroke="#d29922" stroke-width="0.5"/>
  <text x="672" y="394" text-anchor="middle" fill="#d29922" font-size="9">Prometheus</text>
  <rect x="715" y="380" width="55" height="20" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="742" y="394" text-anchor="middle" fill="#58a6ff" font-size="9">Tempo</text>
  <rect x="780" y="380" width="45" height="20" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="0.5"/>
  <text x="802" y="394" text-anchor="middle" fill="#3fb950" font-size="9">Loki</text>
  <rect x="835" y="380" width="95" height="20" rx="3" fill="#0d1117" stroke="#a371f7" stroke-width="0.5"/>
  <text x="882" y="394" text-anchor="middle" fill="#a371f7" font-size="9">Pyroscope</text>
  <text x="785" y="425" text-anchor="middle" fill="#8b949e" font-size="9">Dashboards · Alerts · Correlation</text>

  <!-- Arrows: app → Phoenix -->
  <path d="M 380 190 Q 300 260 190 320" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#aB)" class="flow"/>
  <text x="250" y="250" fill="#58a6ff" font-size="10" font-weight="600">OTLP HTTP</text>
  <text x="250" y="264" fill="#8b949e" font-size="9">:6006/v1/traces</text>

  <!-- Arrows: app → Grafana -->
  <path d="M 600 190 Q 700 260 785 320" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#aG)" class="flow"/>
  <text x="720" y="250" fill="#3fb950" font-size="10" font-weight="600">OTLP HTTP</text>
  <text x="720" y="264" fill="#8b949e" font-size="9">:4318/v1/traces</text>

  <!-- Prometheus scrape arrow -->
  <path d="M 780 320 Q 650 260 380 155" stroke="#d29922" stroke-width="1" fill="none" marker-end="url(#aO)" class="flow" stroke-dasharray="3 3"/>
  <text x="520" y="245" fill="#d29922" font-size="9">Prometheus scrape /actuator/prometheus</text>

  <!-- ═══ Trace visualization section ═══ -->
  <rect x="50" y="480" width="900" height="200" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="505" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">Trace Visualization — RAG Query Call Stack</text>
  <text x="500" y="520" text-anchor="middle" fill="#8b949e" font-size="10">traceId: abc123def456 · service: mousike</text>

  <!-- Span bars -->
  <g class="span-bar" style="animation-delay:0.3s">
    <rect x="80" y="540" width="840" height="22" rx="4" fill="#1f6feb" opacity="0.3"/>
    <text x="90" y="555" fill="#58a6ff" font-size="10" font-weight="600">HTTP POST /api/rag/query</text>
    <text x="900" y="555" text-anchor="end" fill="#8b949e" font-size="9">1250ms</text>
  </g>

  <g class="span-bar" style="animation-delay:0.5s">
    <rect x="120" y="567" width="180" height="22" rx="4" fill="#d29922" opacity="0.3"/>
    <text x="130" y="582" fill="#d29922" font-size="10">embedding nomic-embed-text</text>
    <text x="290" y="582" text-anchor="end" fill="#8b949e" font-size="9">150ms</text>
  </g>

  <g class="span-bar" style="animation-delay:0.7s">
    <rect x="310" y="567" width="120" height="22" rx="4" fill="#3fb950" opacity="0.3"/>
    <text x="320" y="582" fill="#3fb950" font-size="10">pg_vector query</text>
    <text x="420" y="582" text-anchor="end" fill="#8b949e" font-size="9">80ms</text>
  </g>

  <g class="span-bar" style="animation-delay:0.9s">
    <rect x="440" y="567" width="450" height="22" rx="4" fill="#a371f7" opacity="0.3"/>
    <text x="450" y="582" fill="#a371f7" font-size="10">chat llama3.2</text>
    <text x="880" y="582" text-anchor="end" fill="#8b949e" font-size="9">950ms</text>
  </g>

  <g class="span-bar" style="animation-delay:1.1s">
    <rect x="900" y="567" width="20" height="22" rx="4" fill="#d29922" opacity="0.3"/>
    <text x="130" y="608" fill="#d29922" font-size="9">DB: save memory</text>
  </g>

  <!-- Span labels -->
  <g style="animation: fadeIn 1s ease-out 1.5s both;">
    <rect x="80" y="610" width="840" height="55" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="100" y="628" fill="#8b949e" font-size="10">Span Attributes (LLM):</text>
    <text x="100" y="645" fill="#a371f7" font-size="9">gen_ai.system: ollama · gen_ai.request.model: llama3.2 · gen_ai.usage.input_tokens: 847</text>
    <text x="100" y="658" fill="#a371f7" font-size="9">gen_ai.usage.output_tokens: 234 · gen_ai.response.finish_reason: stop</text>
  </g>
</svg>
</body>
</html>
