<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousike — Document Ingestion Pipeline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 6px; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 30px; }
  svg { max-width: 1000px; width: 100%; }

  @keyframes dash { to { stroke-dashoffset: -16; } }
  @keyframes slideRight { 0% { transform: translateX(-30px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }
  @keyframes expand { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes count { 0% { content: "0"; } 100% { content: "247"; } }
  @keyframes fillUp { from { height: 0; } to { height: var(--h); } }

  .flow { stroke-dasharray: 6 4; animation: dash 0.8s linear infinite; }
  .stage { animation: fadeIn 0.5s ease-out both; }
  .particle { animation: slideRight 2s ease-in-out infinite; }
</style>
</head>
<body>
<h1>Document Ingestion Pipeline</h1>
<p class="subtitle">PDF → Tika → TokenSplitter → Ollama Embedding → PGVector</p>

<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
  </defs>

  <!-- Stage 1: Input -->
  <g class="stage" style="animation-delay:0s">
    <rect x="20" y="80" width="130" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="85" y="110" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Input</text>

    <rect x="35" y="120" width="100" height="18" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="85" y="133" text-anchor="middle" fill="#c9d1d9" font-size="8">music-theory.pdf</text>
    <rect x="35" y="142" width="100" height="18" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="85" y="155" text-anchor="middle" fill="#c9d1d9" font-size="8">composers.pdf</text>
    <rect x="35" y="164" width="100" height="18" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="85" y="177" text-anchor="middle" fill="#c9d1d9" font-size="8">instruments.pdf</text>

    <text x="85" y="210" text-anchor="middle" fill="#8b949e" font-size="9">POST /api/ingest</text>
    <text x="85" y="222" text-anchor="middle" fill="#8b949e" font-size="9">or startup runner</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="150" y1="140" x2="195" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#aR)" class="flow"/>
  <circle cx="170" cy="140" r="3" fill="#58a6ff" class="particle"/>

  <!-- Stage 2: Tika Parser -->
  <g class="stage" style="animation-delay:0.2s">
    <rect x="200" y="80" width="140" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="270" y="105" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">Apache Tika</text>
    <text x="270" y="120" text-anchor="middle" fill="#8b949e" font-size="10">TikaDocumentReader</text>

    <text x="270" y="145" text-anchor="middle" fill="#c9d1d9" font-size="10">PDF → Document</text>
    <text x="270" y="162" text-anchor="middle" fill="#8b949e" font-size="9">Extracts raw text</text>
    <text x="270" y="177" text-anchor="middle" fill="#8b949e" font-size="9">from any format</text>

    <text x="270" y="210" text-anchor="middle" fill="#d29922" font-size="9">Output: List&lt;Document&gt;</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="340" y1="140" x2="385" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#aR)" class="flow"/>
  <circle cx="360" cy="140" r="3" fill="#d29922" class="particle" style="animation-delay:0.5s"/>

  <!-- Stage 3: Metadata Enrichment -->
  <g class="stage" style="animation-delay:0.4s">
    <rect x="390" y="80" width="140" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="460" y="105" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">Metadata</text>
    <text x="460" y="120" text-anchor="middle" fill="#8b949e" font-size="10">Enrichment</text>

    <rect x="405" y="132" width="120" height="16" rx="2" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="465" y="143" text-anchor="middle" fill="#c9d1d9" font-size="8">source: filename</text>
    <rect x="405" y="152" width="120" height="16" rx="2" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="465" y="163" text-anchor="middle" fill="#c9d1d9" font-size="8">category: theory</text>
    <rect x="405" y="172" width="120" height="16" rx="2" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="465" y="183" text-anchor="middle" fill="#c9d1d9" font-size="8">ingested_at: epoch</text>

    <text x="460" y="210" text-anchor="middle" fill="#3fb950" font-size="9">Stream .map()</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="530" y1="140" x2="575" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#aR)" class="flow"/>
  <circle cx="550" cy="140" r="3" fill="#3fb950" class="particle" style="animation-delay:1s"/>

  <!-- Stage 4: Token Splitter -->
  <g class="stage" style="animation-delay:0.6s">
    <rect x="580" y="80" width="140" height="120" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="650" y="105" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">TokenText</text>
    <text x="650" y="120" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">Splitter</text>

    <!-- Visual: 1 doc → many chunks -->
    <rect x="600" y="135" width="40" height="35" rx="3" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <text x="620" y="155" text-anchor="middle" fill="#a371f7" font-size="8">1 doc</text>

    <text x="650" y="157" text-anchor="middle" fill="#c9d1d9" font-size="14">→</text>

    <rect x="660" y="132" width="25" height="12" rx="2" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <rect x="660" y="147" width="25" height="12" rx="2" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <rect x="660" y="162" width="25" height="12" rx="2" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <rect x="690" y="132" width="25" height="12" rx="2" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <rect x="690" y="147" width="25" height="12" rx="2" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="0.5"/>
    <text x="702" y="173" text-anchor="middle" fill="#a371f7" font-size="7">chunks</text>

    <text x="650" y="210" text-anchor="middle" fill="#a371f7" font-size="9">~800 tokens/chunk</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="720" y1="140" x2="765" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#aR)" class="flow"/>
  <circle cx="740" cy="140" r="3" fill="#a371f7" class="particle" style="animation-delay:1.5s"/>

  <!-- Stage 5: Embedding -->
  <g class="stage" style="animation-delay:0.8s">
    <rect x="770" y="50" width="200" height="100" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="870" y="75" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="700">Ollama Embed</text>
    <text x="870" y="92" text-anchor="middle" fill="#8b949e" font-size="10">nomic-embed-text</text>
    <text x="870" y="110" text-anchor="middle" fill="#c9d1d9" font-size="10">text → float[768]</text>
    <text x="870" y="128" text-anchor="middle" fill="#8b949e" font-size="9">768 dimensions</text>
  </g>

  <!-- Arrow 5 (down) -->
  <line x1="870" y1="150" x2="870" y2="200" stroke="#3fb950" stroke-width="1.5" marker-end="url(#aG)" class="flow"/>

  <!-- Stage 6: PGVector Store -->
  <g class="stage" style="animation-delay:1.0s">
    <rect x="770" y="200" width="200" height="110" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="870" y="225" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">PGVector Store</text>
    <text x="870" y="242" text-anchor="middle" fill="#8b949e" font-size="10">vectorStore.accept(chunks)</text>
    <text x="870" y="262" text-anchor="middle" fill="#c9d1d9" font-size="10">HNSW Index</text>
    <text x="870" y="278" text-anchor="middle" fill="#8b949e" font-size="9">cosine distance</text>
    <text x="870" y="298" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">247 chunks stored</text>
  </g>

  <!-- ═══ Data transformation visual ═══ -->
  <rect x="20" y="340" width="950" height="190" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="495" y="365" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="700">Data Transformation at Each Stage</text>

  <!-- Stage samples -->
  <g class="stage" style="animation-delay:0.3s">
    <rect x="40" y="380" width="160" height="70" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="0.5"/>
    <text x="120" y="397" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">Raw PDF</text>
    <text x="120" y="415" text-anchor="middle" fill="#8b949e" font-size="8">Binary file</text>
    <text x="120" y="430" text-anchor="middle" fill="#8b949e" font-size="8">music-theory.pdf</text>
    <text x="120" y="443" text-anchor="middle" fill="#484f58" font-size="8">~2MB</text>
  </g>
  <text x="210" y="420" fill="#58a6ff" font-size="16">→</text>

  <g class="stage" style="animation-delay:0.5s">
    <rect x="230" y="380" width="160" height="70" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="0.5"/>
    <text x="310" y="397" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">Parsed Document</text>
    <text x="310" y="415" text-anchor="middle" fill="#8b949e" font-size="8">text: "Music theory is..."</text>
    <text x="310" y="430" text-anchor="middle" fill="#8b949e" font-size="8">metadata: {}</text>
    <text x="310" y="443" text-anchor="middle" fill="#484f58" font-size="8">1 document object</text>
  </g>
  <text x="400" y="420" fill="#58a6ff" font-size="16">→</text>

  <g class="stage" style="animation-delay:0.7s">
    <rect x="420" y="380" width="160" height="70" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="0.5"/>
    <text x="500" y="397" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">Enriched</text>
    <text x="500" y="415" text-anchor="middle" fill="#8b949e" font-size="8">+ source: "music-theory.pdf"</text>
    <text x="500" y="430" text-anchor="middle" fill="#8b949e" font-size="8">+ category: "theory"</text>
    <text x="500" y="443" text-anchor="middle" fill="#8b949e" font-size="8">+ ingested_at: 170912...</text>
  </g>
  <text x="590" y="420" fill="#58a6ff" font-size="16">→</text>

  <g class="stage" style="animation-delay:0.9s">
    <rect x="610" y="380" width="160" height="70" rx="6" fill="#0d1117" stroke="#a371f7" stroke-width="0.5"/>
    <text x="690" y="397" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">42 Chunks</text>
    <text x="690" y="415" text-anchor="middle" fill="#8b949e" font-size="8">~800 tokens each</text>
    <text x="690" y="430" text-anchor="middle" fill="#8b949e" font-size="8">metadata preserved</text>
    <text x="690" y="443" text-anchor="middle" fill="#8b949e" font-size="8">per chunk</text>
  </g>
  <text x="780" y="420" fill="#58a6ff" font-size="16">→</text>

  <g class="stage" style="animation-delay:1.1s">
    <rect x="800" y="380" width="150" height="70" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="0.5"/>
    <text x="875" y="397" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">Vector Rows</text>
    <text x="875" y="415" text-anchor="middle" fill="#8b949e" font-size="8">id: UUID</text>
    <text x="875" y="430" text-anchor="middle" fill="#8b949e" font-size="8">content: text</text>
    <text x="875" y="443" text-anchor="middle" fill="#8b949e" font-size="8">embedding: float[768]</text>
  </g>

  <!-- Category breakdown -->
  <g class="stage" style="animation-delay:1.3s">
    <rect x="40" y="465" width="200" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="140" y="482" text-anchor="middle" fill="#c9d1d9" font-size="10" font-weight="600">Bulk Ingestion Results</text>
    <text x="140" y="500" text-anchor="middle" fill="#8b949e" font-size="9">theory:42 · composers:58 · instruments:73 · history:74</text>
  </g>
</svg>
</body>
</html>
