<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousike — Architecture Overview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #f0f6fc; }
  .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 40px; }
  svg { max-width: 1100px; width: 100%; }

  /* Animated pulse for active services */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes flowDot { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }

  .service-box { animation: fadeIn 0.6s ease-out both; }
  .service-box:nth-child(2) { animation-delay: 0.1s; }
  .service-box:nth-child(3) { animation-delay: 0.2s; }
  .service-box:nth-child(4) { animation-delay: 0.3s; }

  .flow-line { stroke-dasharray: 6 4; animation: dash 1s linear infinite; }
  .flow-line-reverse { stroke-dasharray: 6 4; animation: dash 1s linear infinite reverse; }
  .pulse { animation: pulse 2s ease-in-out infinite; }

  .data-dot { r: 4; fill: #58a6ff; }
  .data-dot-1 { offset-path: path('M 550 70 L 550 130'); animation: flowDot 2s ease-in-out infinite; }
  .data-dot-2 { offset-path: path('M 550 320 L 550 390'); animation: flowDot 2.5s ease-in-out infinite 0.5s; }
  .data-dot-3 { offset-path: path('M 350 520 L 200 580'); animation: flowDot 3s ease-in-out infinite 1s; }
  .data-dot-4 { offset-path: path('M 550 520 L 550 580'); animation: flowDot 3s ease-in-out infinite 1.2s; }
  .data-dot-5 { offset-path: path('M 750 520 L 900 580'); animation: flowDot 3s ease-in-out infinite 0.8s; }

  .legend { display: flex; gap: 24px; margin-top: 30px; font-size: 13px; color: #8b949e; flex-wrap: wrap; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Mousike — System Architecture</h1>
<p class="subtitle">Spring Boot 4 + Spring AI 2.0 + Ollama + PGVector + MCP</p>

<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d29922;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#a371f7"/></marker>
  </defs>

  <!-- User / Browser -->
  <g class="service-box">
    <rect x="350" y="15" width="400" height="50" rx="8" fill="url(#grad-blue)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="550" y="45" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="600">User / Browser</text>
    <text x="550" y="60" text-anchor="middle" fill="#8b949e" font-size="10">Vaadin UI  ·  REST API  ·  cURL</text>
  </g>

  <!-- Arrow: User → mousike -->
  <line x1="550" y1="65" x2="550" y2="130" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)" class="flow-line"/>
  <text x="570" y="100" fill="#8b949e" font-size="10">HTTP :8080</text>
  <circle class="data-dot data-dot-1"/>

  <!-- mousike-app box -->
  <g class="service-box">
    <rect x="80" y="130" width="940" height="200" rx="12" fill="url(#grad-blue)" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="550" y="155" text-anchor="middle" fill="#1f6feb" font-size="16" font-weight="700">mousike-app</text>
    <text x="550" y="170" text-anchor="middle" fill="#8b949e" font-size="11">Spring Boot 4.0.3  ·  Spring AI 2.0.0-M2  ·  Java 21</text>

    <!-- Internal services -->
    <rect x="110" y="190" width="150" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="185" y="212" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Chat Service</text>
    <text x="185" y="228" text-anchor="middle" fill="#8b949e" font-size="10">Memory · Streaming</text>

    <rect x="290" y="190" width="170" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="375" y="212" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">RAG Pipeline</text>
    <text x="375" y="228" text-anchor="middle" fill="#8b949e" font-size="10">Naive · Advanced · Agentic</text>

    <rect x="490" y="190" width="150" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="565" y="212" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Search Service</text>
    <text x="565" y="228" text-anchor="middle" fill="#8b949e" font-size="10">Semantic · Filtered</text>

    <rect x="670" y="190" width="170" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="755" y="212" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Structured Output</text>
    <text x="755" y="228" text-anchor="middle" fill="#8b949e" font-size="10">Classify · Extract</text>

    <!-- Guardrails bar -->
    <rect x="110" y="260" width="530" height="30" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="375" y="280" text-anchor="middle" fill="#f85149" font-size="11" font-weight="600">3-Layer Guardrails: RetrievalGate → System Prompt → OutputValidator</text>

    <!-- MCP Client badge -->
    <rect x="670" y="260" width="170" height="30" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
    <text x="755" y="280" text-anchor="middle" fill="#a371f7" font-size="11" font-weight="600">MCP Client (SSE)</text>

    <!-- Observability badges -->
    <rect x="870" y="190" width="130" height="55" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
    <text x="935" y="212" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">Observability</text>
    <text x="935" y="228" text-anchor="middle" fill="#8b949e" font-size="9">OTel · Prometheus</text>
  </g>

  <!-- Arrow: mousike → document-service -->
  <line x1="755" y1="330" x2="755" y2="390" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrowPurple)" class="flow-line"/>
  <text x="775" y="365" fill="#a371f7" font-size="10">MCP/SSE :8090</text>
  <circle class="data-dot data-dot-2" style="offset-path: path('M 755 330 L 755 390')"/>

  <!-- document-service box -->
  <g class="service-box">
    <rect x="500" y="390" width="510" height="130" rx="12" fill="url(#grad-green)" stroke="#3fb950" stroke-width="1.5"/>
    <text x="755" y="415" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">document-service</text>
    <text x="755" y="430" text-anchor="middle" fill="#8b949e" font-size="11">Spring Boot 4.0.3  ·  MCP Server  ·  :8090</text>

    <rect x="530" y="445" width="160" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="610" y="467" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Ingestion Pipeline</text>
    <text x="610" y="483" text-anchor="middle" fill="#8b949e" font-size="10">Tika → Chunk → Embed</text>

    <rect x="720" y="445" width="160" height="50" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
    <text x="800" y="467" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">MCP Server</text>
    <text x="800" y="483" text-anchor="middle" fill="#8b949e" font-size="10">3 @Tool Methods</text>

    <rect x="910" y="445" width="80" height="50" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
    <text x="950" y="472" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">OTel</text>
  </g>

  <!-- Infrastructure boxes -->
  <!-- PostgreSQL + PGVector -->
  <g class="service-box">
    <rect x="80" y="580" width="220" height="80" rx="10" fill="url(#grad-orange)" stroke="#d29922" stroke-width="1.5"/>
    <text x="190" y="610" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">PostgreSQL + PGVector</text>
    <text x="190" y="628" text-anchor="middle" fill="#8b949e" font-size="10">HNSW · 768-dim · Cosine</text>
    <text x="190" y="643" text-anchor="middle" fill="#8b949e" font-size="10">:5432 · Chat Memory + Vectors</text>
    <circle cx="80" cy="580" r="5" fill="#3fb950" class="pulse"/>
  </g>

  <!-- Ollama -->
  <g class="service-box">
    <rect x="370" y="580" width="220" height="80" rx="10" fill="url(#grad-purple)" stroke="#a371f7" stroke-width="1.5"/>
    <text x="480" y="610" text-anchor="middle" fill="#a371f7" font-size="14" font-weight="700">Ollama (Host GPU)</text>
    <text x="480" y="628" text-anchor="middle" fill="#8b949e" font-size="10">llama3.2 · nomic-embed-text</text>
    <text x="480" y="643" text-anchor="middle" fill="#8b949e" font-size="10">:11434 · Chat + Embedding</text>
    <circle cx="370" cy="580" r="5" fill="#3fb950" class="pulse"/>
  </g>

  <!-- Phoenix + Grafana -->
  <g class="service-box">
    <rect x="660" y="580" width="360" height="80" rx="10" fill="url(#grad-blue)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="840" y="605" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Observability Stack</text>
    <text x="760" y="628" text-anchor="middle" fill="#d29922" font-size="11">Phoenix :6006</text>
    <text x="920" y="628" text-anchor="middle" fill="#3fb950" font-size="11">Grafana :3000</text>
    <text x="840" y="648" text-anchor="middle" fill="#8b949e" font-size="10">LLM Traces · Metrics · Logs · Dashboards</text>
    <circle cx="660" cy="580" r="5" fill="#3fb950" class="pulse"/>
  </g>

  <!-- Arrows from services to infra -->
  <line x1="250" y1="330" x2="190" y2="580" stroke="#d29922" stroke-width="1" marker-end="url(#arrowBlue)" class="flow-line" opacity="0.6"/>
  <line x1="450" y1="330" x2="480" y2="580" stroke="#a371f7" stroke-width="1" marker-end="url(#arrowPurple)" class="flow-line" opacity="0.6"/>
  <line x1="935" y1="250" x2="840" y2="580" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrowBlue)" class="flow-line" opacity="0.6"/>
  <line x1="610" y1="495" x2="190" y2="580" stroke="#d29922" stroke-width="1" marker-end="url(#arrowBlue)" class="flow-line" opacity="0.6"/>
  <line x1="610" y1="495" x2="480" y2="580" stroke="#a371f7" stroke-width="1" marker-end="url(#arrowPurple)" class="flow-line" opacity="0.6"/>
</svg>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1f6feb"></div> mousike-app</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div> document-service</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a371f7"></div> MCP / LLM</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d29922"></div> Database / Observability</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div> Guardrails</div>
</div>
</body>
</html>
