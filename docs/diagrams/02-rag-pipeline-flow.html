<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mousike — RAG Pipeline Flow (Animated)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 6px; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 30px; }
  .tab { padding: 8px 20px; border-radius: 20px; border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; font-size: 13px; transition: all 0.3s; }
  .tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .tab:hover { border-color: #58a6ff; }
  svg { max-width: 900px; width: 100%; }
  .pipeline { display: none; }
  .pipeline.active { display: block; }

  @keyframes flowRight { 0% { transform: translateX(-20px); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(20px); opacity: 0; } }
  @keyframes flowDown { 0% { transform: translateY(-15px); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(15px); opacity: 0; } }
  @keyframes gateCheck { 0%,40% { fill: #d29922; } 50% { fill: #3fb950; } 60%,100% { fill: #3fb950; } }
  @keyframes reject { 0%,40% { fill: #d29922; } 50% { fill: #f85149; } 60%,100% { fill: #f85149; } }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes stepReveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .animated-dash { stroke-dasharray: 8 4; animation: dash 0.8s linear infinite; }
  .step { animation: stepReveal 0.5s ease-out both; }
  .dot-flow { animation: flowDown 1.5s ease-in-out infinite; }
  .dot-flow-right { animation: flowRight 1.5s ease-in-out infinite; }
  .gate-pass { animation: gateCheck 3s ease-in-out infinite; }
  .gate-fail { animation: reject 3s ease-in-out infinite; }
</style>
</head>
<body>
<h1>RAG Pipeline — Three Retrieval Strategies</h1>
<p class="subtitle">Click a mode to see the animated data flow</p>

<div class="tabs">
  <div class="tab active" onclick="showMode('naive')">Naive RAG</div>
  <div class="tab" onclick="showMode('advanced')">Advanced RAG</div>
  <div class="tab" onclick="showMode('agentic')">Agentic RAG</div>
</div>

<!-- NAIVE RAG -->
<div id="naive" class="pipeline active">
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f85149"/></marker>
  </defs>

  <!-- Step 1: User Question -->
  <g class="step" style="animation-delay:0s">
    <rect x="320" y="10" width="260" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="450" y="32" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">POST /api/rag/query?mode=naive</text>
    <text x="450" y="48" text-anchor="middle" fill="#8b949e" font-size="10">{"question": "What are Bach's works?"}</text>
  </g>

  <line x1="450" y1="60" x2="450" y2="100" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB)" class="animated-dash"/>
  <circle cx="450" cy="80" r="4" fill="#58a6ff" class="dot-flow" style="animation-delay:0.2s"/>

  <!-- Step 2: Layer 1 — Retrieval Gate -->
  <g class="step" style="animation-delay:0.3s">
    <rect x="250" y="100" width="400" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="290" y="123" fill="#d29922" font-size="12" font-weight="700">LAYER 1</text>
    <text x="450" y="123" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">RagRetrievalGate</text>
    <text x="450" y="145" text-anchor="middle" fill="#8b949e" font-size="11">VectorStore.similaritySearch(query, topK=5)</text>
    <text x="450" y="163" text-anchor="middle" fill="#8b949e" font-size="10">threshold ≥ 0.65  ·  min 2 chunks required</text>
    <circle cx="630" cy="140" r="10" class="gate-pass"/>
    <text x="630" y="144" text-anchor="middle" fill="#0d1117" font-size="10" font-weight="700">✓</text>
  </g>

  <!-- Reject path -->
  <line x1="650" y1="140" x2="780" y2="140" stroke="#f85149" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <rect x="780" y="118" width="110" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="835" y="137" text-anchor="middle" fill="#f85149" font-size="10" font-weight="600">REJECTED</text>
  <text x="835" y="152" text-anchor="middle" fill="#8b949e" font-size="9">"I don't have enough..."</text>

  <line x1="450" y1="180" x2="450" y2="220" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)" class="animated-dash"/>
  <circle cx="450" cy="200" r="4" fill="#3fb950" class="dot-flow" style="animation-delay:0.5s"/>

  <!-- Step 3: Layer 2 — LLM with System Prompt -->
  <g class="step" style="animation-delay:0.6s">
    <rect x="250" y="220" width="400" height="80" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="290" y="243" fill="#a371f7" font-size="12" font-weight="700">LAYER 2</text>
    <text x="450" y="243" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">ChatClient (ragChatClient)</text>
    <text x="450" y="265" text-anchor="middle" fill="#8b949e" font-size="11">System: "Answer ONLY based on context..."</text>
    <text x="450" y="283" text-anchor="middle" fill="#8b949e" font-size="10">Ollama llama3.2  ·  QuestionAnswerAdvisor(topK=5, threshold=0.50)</text>
  </g>

  <line x1="450" y1="300" x2="450" y2="340" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)" class="animated-dash"/>
  <circle cx="450" cy="320" r="4" fill="#3fb950" class="dot-flow" style="animation-delay:0.8s"/>

  <!-- Step 4: Layer 3 — Output Validator -->
  <g class="step" style="animation-delay:0.9s">
    <rect x="250" y="340" width="400" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="290" y="363" fill="#f85149" font-size="12" font-weight="700">LAYER 3</text>
    <text x="450" y="363" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">OutputValidator</text>
    <text x="450" y="385" text-anchor="middle" fill="#8b949e" font-size="11">Grounding ratio check: words_in_chunks / total_words</text>
    <text x="450" y="403" text-anchor="middle" fill="#8b949e" font-size="10">ratio must be ≥ 0.30  ·  skips words ≤ 4 chars</text>
    <circle cx="630" cy="380" r="10" class="gate-pass"/>
    <text x="630" y="384" text-anchor="middle" fill="#0d1117" font-size="10" font-weight="700">✓</text>
  </g>

  <!-- Reject path -->
  <line x1="650" y1="380" x2="780" y2="380" stroke="#f85149" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <rect x="780" y="358" width="110" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="835" y="377" text-anchor="middle" fill="#f85149" font-size="10" font-weight="600">REJECTED</text>
  <text x="835" y="392" text-anchor="middle" fill="#8b949e" font-size="9">Hallucination detected</text>

  <line x1="450" y1="420" x2="450" y2="470" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)" class="animated-dash"/>
  <circle cx="450" cy="445" r="4" fill="#3fb950" class="dot-flow" style="animation-delay:1.1s"/>

  <!-- Step 5: Response -->
  <g class="step" style="animation-delay:1.2s">
    <rect x="300" y="470" width="300" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="450" y="495" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">Validated Answer</text>
    <text x="450" y="510" text-anchor="middle" fill="#8b949e" font-size="10">Grounded in retrieved documents</text>
  </g>

  <!-- Side: PGVector -->
  <g class="step" style="animation-delay:0.4s">
    <rect x="20" y="115" width="180" height="50" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1"/>
    <text x="110" y="137" text-anchor="middle" fill="#d29922" font-size="12" font-weight="600">PGVector Store</text>
    <text x="110" y="153" text-anchor="middle" fill="#8b949e" font-size="10">768-dim · HNSW · Cosine</text>
  </g>
  <line x1="200" y1="140" x2="250" y2="140" stroke="#d29922" stroke-width="1" marker-end="url(#arrB)" class="animated-dash"/>

  <!-- Side: Ollama -->
  <g class="step" style="animation-delay:0.7s">
    <rect x="20" y="235" width="180" height="50" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
    <text x="110" y="257" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">Ollama llama3.2</text>
    <text x="110" y="273" text-anchor="middle" fill="#8b949e" font-size="10">temp=0.7 · ctx=4096</text>
  </g>
  <line x1="200" y1="260" x2="250" y2="260" stroke="#a371f7" stroke-width="1" marker-end="url(#arrB)" class="animated-dash"/>

  <!-- Timing labels -->
  <text x="450" y="560" text-anchor="middle" fill="#484f58" font-size="12">Naive RAG: topK=5 · threshold=0.50 (advisor) / 0.65 (gate) · 3-layer guardrail</text>
</svg>
</div>

<!-- ADVANCED RAG -->
<div id="advanced" class="pipeline">
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrG2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
  </defs>

  <g class="step"><rect x="280" y="10" width="340" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="450" y="32" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">POST /api/rag/query?mode=advanced</text>
    <text x="450" y="48" text-anchor="middle" fill="#8b949e" font-size="10">Higher thresholds, more documents</text>
  </g>
  <line x1="450" y1="60" x2="450" y2="100" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB2)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.2s">
    <rect x="250" y="100" width="400" height="75" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="290" y="123" fill="#d29922" font-size="12" font-weight="700">LAYER 1</text>
    <text x="450" y="123" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">RagRetrievalGate</text>
    <text x="450" y="145" text-anchor="middle" fill="#8b949e" font-size="11">topK=10  ·  threshold=0.65  ·  min 2 chunks</text>
    <text x="450" y="162" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">↑ Stricter: 10 candidates, higher bar</text>
  </g>
  <line x1="450" y1="175" x2="450" y2="215" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG2)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.4s">
    <rect x="250" y="215" width="400" height="90" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="290" y="238" fill="#a371f7" font-size="12" font-weight="700">LAYER 2</text>
    <text x="450" y="238" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">Inline ChatClient</text>
    <text x="450" y="258" text-anchor="middle" fill="#8b949e" font-size="11">Built in AdvancedRagService (not shared bean)</text>
    <text x="450" y="275" text-anchor="middle" fill="#8b949e" font-size="10">QuestionAnswerAdvisor(topK=10, threshold=0.65)</text>
    <text x="450" y="292" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">↑ Advisor also uses 0.65 threshold (vs 0.50 naive)</text>
  </g>
  <line x1="450" y1="305" x2="450" y2="345" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG2)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.6s">
    <rect x="250" y="345" width="400" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="290" y="368" fill="#f85149" font-size="12" font-weight="700">LAYER 3</text>
    <text x="450" y="368" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600" dx="30">OutputValidator</text>
    <text x="450" y="390" text-anchor="middle" fill="#8b949e" font-size="11">Same grounding check ≥ 0.30</text>
  </g>
  <line x1="450" y1="405" x2="450" y2="445" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG2)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.8s">
    <rect x="300" y="445" width="300" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="450" y="472" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">High-Confidence Answer</text>
    <text x="450" y="488" text-anchor="middle" fill="#8b949e" font-size="10">More sources, stricter validation</text>
  </g>

  <text x="450" y="540" text-anchor="middle" fill="#484f58" font-size="12">Advanced RAG: topK=10 · threshold=0.65 (both advisor + gate) · citation required</text>
</svg>
</div>

<!-- AGENTIC RAG -->
<div id="agentic" class="pipeline">
<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrB3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrP3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#a371f7"/></marker>
    <marker id="arrG3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
  </defs>

  <g class="step"><rect x="280" y="10" width="340" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="450" y="32" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">POST /api/rag/query?mode=agentic</text>
    <text x="450" y="48" text-anchor="middle" fill="#8b949e" font-size="10">LLM decides which tools to call</text>
  </g>
  <line x1="450" y1="60" x2="450" y2="100" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB3)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.2s">
    <rect x="230" y="100" width="440" height="80" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="450" y="125" text-anchor="middle" fill="#a371f7" font-size="15" font-weight="700">agenticChatClient</text>
    <text x="450" y="145" text-anchor="middle" fill="#8b949e" font-size="11">Ollama llama3.2 + MCP Tool Callbacks</text>
    <text x="450" y="165" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">No guardrails — LLM autonomously calls tools</text>
  </g>

  <!-- Tool call loop -->
  <line x1="450" y1="180" x2="450" y2="220" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrP3)" class="animated-dash"/>
  <text x="470" y="205" fill="#a371f7" font-size="10">Tool call</text>

  <!-- MCP SSE -->
  <g class="step" style="animation-delay:0.4s">
    <rect x="250" y="220" width="400" height="50" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="450" y="245" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="600">MCP Client → SSE → MCP Server</text>
    <text x="450" y="260" text-anchor="middle" fill="#8b949e" font-size="10">http://document-service:8090/mcp/sse</text>
  </g>
  <line x1="450" y1="270" x2="450" y2="310" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG3)" class="animated-dash"/>

  <!-- Tool selection -->
  <g class="step" style="animation-delay:0.6s">
    <rect x="130" y="310" width="640" height="110" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="450" y="335" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">document-service MCP Tools</text>

    <rect x="150" y="350" width="180" height="55" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="240" y="372" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">searchMusicKnowledge</text>
    <text x="240" y="390" text-anchor="middle" fill="#8b949e" font-size="9">query, topK, minScore</text>

    <rect x="360" y="350" width="160" height="55" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="440" y="372" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">searchByCategory</text>
    <text x="440" y="390" text-anchor="middle" fill="#8b949e" font-size="9">query, category</text>

    <rect x="550" y="350" width="200" height="55" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="650" y="372" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">listAvailableDocuments</text>
    <text x="650" y="390" text-anchor="middle" fill="#8b949e" font-size="9">no params</text>
  </g>

  <!-- Tool results back -->
  <path d="M 770 365 Q 820 365 820 250 Q 820 140 670 140" stroke="#d29922" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrB3)"/>
  <text x="830" y="250" fill="#d29922" font-size="10" transform="rotate(90,830,250)">Tool results</text>

  <!-- LLM synthesize -->
  <line x1="450" y1="420" x2="450" y2="470" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB3)" class="animated-dash"/>

  <g class="step" style="animation-delay:0.8s">
    <rect x="300" y="470" width="300" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="495" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">LLM-Synthesized Answer</text>
    <text x="450" y="510" text-anchor="middle" fill="#8b949e" font-size="10">Tool-augmented, multi-source</text>
  </g>

  <!-- PGVector on the side -->
  <g class="step" style="animation-delay:0.5s">
    <rect x="20" y="340" width="100" height="45" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
    <text x="70" y="362" text-anchor="middle" fill="#d29922" font-size="10" font-weight="600">PGVector</text>
    <text x="70" y="375" text-anchor="middle" fill="#8b949e" font-size="9">768-dim</text>
  </g>
  <line x1="120" y1="365" x2="150" y2="375" stroke="#d29922" stroke-width="1" marker-end="url(#arrB3)"/>

  <text x="450" y="565" text-anchor="middle" fill="#484f58" font-size="12">Agentic RAG: No guardrails · LLM controls tool invocation · Multi-turn possible</text>
</svg>
</div>

<script>
function showMode(mode) {
  document.querySelectorAll('.pipeline').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(mode).classList.add('active');
  event.target.classList.add('active');
}
</script>
</body>
</html>
