apiVersion: apps/v1
kind: Deployment
metadata:
  name: mousike
  namespace: rag
  labels:
    app: mousike
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mousike
  template:
    metadata:
      labels:
        app: mousike
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: mousike
          image: mousike-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/mousike"
            - name: SPRING_AI_OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: OLLAMA_BASE_URL
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: REDIS_HOST
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: mousike-service
  namespace: rag
spec:
  type: NodePort
  selector:
    app: mousike
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
