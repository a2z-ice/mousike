apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - name: ui
              containerPort: 6006
            - name: otlp-grpc
              containerPort: 4317
          env:
            - name: PHOENIX_WORKING_DIR
              value: /phoenix/data
          volumeMounts:
            - name: phoenix-data
              mountPath: /phoenix/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: phoenix-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-service
  namespace: rag
spec:
  type: NodePort
  selector:
    app: phoenix
  ports:
    - name: ui
      port: 6006
      targetPort: 6006
      nodePort: 30600
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
