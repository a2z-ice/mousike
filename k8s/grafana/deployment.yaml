apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-lgtm
  template:
    metadata:
      labels:
        app: grafana-lgtm
    spec:
      containers:
        - name: grafana-lgtm
          image: grafana/otel-lgtm:latest
          ports:
            - name: ui
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-lgtm-service
  namespace: rag
spec:
  type: NodePort
  selector:
    app: grafana-lgtm
  ports:
    - name: ui
      port: 3000
      targetPort: 3000
      nodePort: 30300
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30418
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
