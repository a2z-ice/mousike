kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mousike-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30090
        hostPort: 8091
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30418
        hostPort: 4318
        protocol: TCP
      - containerPort: 30600
        hostPort: 6006
        protocol: TCP
  - role: worker
    labels:
      workload: app
  - role: worker
    labels:
      workload: data
